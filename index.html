<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Многоязычный переводчик</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232563eb'/%3E%3Ctext x='50' y='58' font-size='48' text-anchor='middle' fill='white' font-family='Arial, Helvetica, sans-serif'%3EML%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="page-bg"></div>

    <div class="container">
      <header class="header">
        <div>
          <p class="eyebrow">Многоязычный переводчик</p>
          <h1 id="pageTitle">EN → RU</h1>
          <p class="subtitle">
            Введите английское слово и переключите язык вывода.
          </p>
        </div>
        <div class="language-switch" aria-label="Выбор языка">
          <button type="button" class="language-button active" data-lang="ru">
            Русский
          </button>
          <button type="button" class="language-button" data-lang="es">
            Español
          </button>
          <button type="button" class="language-button" data-lang="fr">
            Français
          </button>
          <button type="button" class="language-button" data-lang="de">
            Deutsch
          </button>
        </div>
      </header>

      <section class="card">
        <label for="inputText">Слово на английском</label>
        <textarea
          id="inputText"
          placeholder="hello, thank you, family..."
          rows="3"
        ></textarea>
        <div class="controls">
          <button type="button" id="translateBtn">Перевести</button>
          <button type="button" id="clearBtn" class="secondary">
            Очистить
          </button>
        </div>
      </section>

      <section class="result">
        <div class="result-card">
          <div class="result-main">
            <h2>Перевод</h2>
            <p id="outputText">Выберите слово или введите свое выражение.</p>
            <p class="hint" id="hintText">
              Нажмите слово для быстрого перевода.
            </p>
          </div>
        </div>

        <div
          id="wordButtons"
          class="word-buttons"
          aria-label="Слова для быстрого перевода"
        ></div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
